name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 语法与逻辑检查 + 打包自检。全部不联网。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 shell 检查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shell 语法检查
        run: |
          for f in files/usr/share/vnt2web/vnt.sh files/usr/share/vnt2web/vnt-core.sh \
                   files/etc/init.d/vnt2web files/etc/uci-defaults/95-vnt2web \
                   scripts/build-ipk.sh; do
            echo "== $f"
            sh -n "$f"
          done

      - name: shellcheck（仅警告，不阻断）
        continue-on-error: true
        run: |
          shellcheck -s sh -e SC3043,SC2039 files/usr/share/vnt2web/*.sh \
            files/etc/init.d/vnt2web files/etc/uci-defaults/95-vnt2web || true

      - name: 打包
        run: python scripts/build-ipk.py

      - name: 运行测试
        run: python scripts/test.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-vnt2web-ipk
          path: dist/*.ipk

  # 打 tag 时创建 Release 并附上 ipk
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 打包
        run: python scripts/build-ipk.py

      - name: 校验产物
        run: |
          ls -l dist/
          test -n "$(ls dist/*.ipk 2>/dev/null)" || { echo "未产出 ipk"; exit 1; }

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
