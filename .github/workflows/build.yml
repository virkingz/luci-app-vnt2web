name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 包子目录：仓库根是 feed，包本体在这个目录下
  PKGDIR: luci-app-vnt2web

jobs:
  # 语法与逻辑检查 + 免 SDK 打包 + 测试。全部不联网。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 shell 检查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shell 语法检查
        run: |
          cd "$PKGDIR"
          for f in root/usr/share/vnt2web/vnt.sh root/usr/share/vnt2web/vnt-core.sh \
                   root/etc/init.d/vnt2web root/etc/uci-defaults/95-vnt2web \
                   scripts/build-ipk.sh; do
            echo "== $f"
            sh -n "$f"
          done

      - name: shellcheck（仅警告，不阻断）
        continue-on-error: true
        run: |
          cd "$PKGDIR"
          shellcheck -s sh -e SC3043,SC2039 root/usr/share/vnt2web/*.sh \
            root/etc/init.d/vnt2web root/etc/uci-defaults/95-vnt2web || true

      - name: 打包（免 SDK 自建 ipk）
        run: |
          cd "$PKGDIR"
          python scripts/build-ipk.py

      - name: 运行测试
        run: |
          cd "$PKGDIR"
          python scripts/test.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-vnt2web-ipk
          path: ${{ env.PKGDIR }}/dist/*.ipk

  # 打 tag 时创建 Release 并附上免 SDK 产出的 ipk（PKGARCH=all，一包通吃）
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 打包
        run: |
          cd "$PKGDIR"
          python scripts/build-ipk.py

      - name: 校验产物
        run: |
          ls -l "$PKGDIR/dist/"
          test -n "$(ls $PKGDIR/dist/*.ipk 2>/dev/null)" || { echo "未产出 ipk"; exit 1; }

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKGDIR }}/dist/*.ipk
          generate_release_notes: true
